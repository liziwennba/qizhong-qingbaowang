<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <title>队伍查询</title>
  <link rel="stylesheet" href="styles.css?v=simple-20260607" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <h1>队伍查询</h1>
        <p>输入玩家名，查看他的全部队伍、红度和战法</p>
      </div>
      <div class="meta" id="metaInfo"></div>
    </header>

    <section class="search-card">
      <input id="searchInput" type="text" placeholder="输入玩家名称" autocomplete="off" />
      <button id="searchBtn">查询</button>
    </section>

    <section id="suggestionsSection" class="section hidden">
      <h2>可能是这些人</h2>
      <div id="suggestions" class="chips"></div>
    </section>

    <section id="resultSection" class="section hidden">
      <div class="section-head">
        <div>
          <h2 id="playerName">-</h2>
          <p id="playerStats" class="sub"></p>
        </div>
      </div>

      <div id="lineupList" class="lineup-list"></div>
    </section>

    <section id="emptySection" class="empty">
      输入玩家名称后，下方会显示他的全部队伍。
    </section>
  </div>
  <script src="player-data.js?v=f7b36b8513aaf53b"></script>
  <script src="app.js?v=simple-20260607"></script>
</body>
</html>
